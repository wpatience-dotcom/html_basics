<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: Arial, Helvetica;
        }

        table {
            width: 50%;
            border: 1px solid #0e0105;
            margin: auto;
            border-collapse: collapse;
        }

        th {
            color: #7e1937;
            border: 1px solid #0e0105;
            padding: 12px 8px;
            text-align: left;
        }

        td {

            color: #7e1937;
            border: 1px solid #0e0105;
            padding: 12px 8px;
            text-align: left;

        }

        .salary {
            color: aqua;
            font-weight: bold;
        }

        /* CSS framework */
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First name</th>
                <th>Last name</th>
                <th>city</th>
                <th>age</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>Nairobi</td>
                <td>30</td>
                <td class="salary">100000</td>
            </tr>

            <tr>
                <td>Jane</td>
                <td>Indaa</td>
                <td>Mombasa</td>
                <td>25</td>
                <td class="salary">80000</td>
            </tr>
            <tr>
                <td>Mike</td>
                <td>Smith</td>
                <td>Kisumu</td>
                <td>35</td>
                <td class="salary">120000</td>
            </tr>
        </tbody>
    </table>
    <!-- list unordered -->
    <ul>
        <li>nairobi</li>
        <li>mombasa</li>
        <li>nakuru</li>
        <li>nyeri</li>
        <li>kisumu</li>
    </ul>

</body>

</html>
