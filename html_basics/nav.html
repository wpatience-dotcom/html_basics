<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lobster&family=Oleo+Script:wght@400;700&display=swap');

        body {
            font-family: 'Oleo Script', cursive;
        }

        nav {
            background-color: #000000;

            display: flex;
            justify-content: center;
        }

        .nav-items {
            background-color: #048181;
            color: #ffffff;
            width: 80%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-items ul {
            display: flex;
            list-style: none;
        }

        .nav-items li {
            margin-left: 20px;
            margin-right: 20px;
        }

        .nav-items a {
            text-decoration: none;
            color: #000000;
            text-transform: uppercase;
        }


        nav-items a:hover {
            color: #0a586b;
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-items">
            <img src="images/icons8-hacker-100.png" alt="Desktop Icon">

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>





</body>

</html>
